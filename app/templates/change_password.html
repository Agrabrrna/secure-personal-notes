{% extends 'base.html' %}{% block title %}Ganti Password{% endblock %}
{% block content %}
<h3>Ganti Password</h3>
<form method="post" class="col-md-4">
  <div class="mb-2"><label class="form-label">Password lama</label><input type="password" name="old_password" class="form-control" required></div>
  <div class="mb-2"><label class="form-label">Password baru</label><input type="password" name="new_password" class="form-control" required minlength="8"></div>
  <button class="btn btn-primary">Simpan</button>
</form>
{% endblock %}
